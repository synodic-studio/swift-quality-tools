  #### 3. multiline_arguments_threshold
  **Priority**: Low
  **Difficulty**: Medium
  
  **What**: Functions with 4+ parameters should have each parameter on its own line
  
  **Why**: Improves readability and maintainability
  
  **Example**:
  ```swift
  // ❌ Hard to read
  func configure(name: String, age: Int, address: String, phone: String) { }
  
  // ✅ Clear and scannable
  func configure(
      name: String,
      age: Int,
      address: String,
      phone: String
  ) { }
  ```
  
  **Note**: SwiftFormat may already handle this - verify before implementing
  
  ---
  
  #### 4. no_if_modifier
new: |
  #### 3. multiline_arguments_threshold
  **Priority**: Low
  **Difficulty**: Medium
  
  **What**: Functions with 4+ parameters should have each parameter on its own line
  
  **Why**: Improves readability and maintainability
  
  **Example**:
  ```swift
  // ❌ Hard to read
  func configure(name: String, age: Int, address: String, phone: String) { }
  
  // ✅ Clear and scannable
  func configure(
      name: String,
      age: Int,
      address: String,
      phone: String
  ) { }
  ```
  
  **Note**: SwiftFormat may already handle this - verify before implementing
  
  ---
  
  #### 3.5. no_modifiers_after_closing_delimiter
  **Priority**: Low
  **Difficulty**: Medium
  
  **What**: Disallow chaining methods/modifiers on the same line as a closing `)` or `]` when the delimiter is on its own line
  
  **Why**: Improves readability - modifiers should start on their own line
  
  **Example**:
  ```swift
  // ❌ Hard to scan
  SomeView(
      parameter: value
  ).padding()
  
  // ✅ Clear structure
  SomeView(
      parameter: value
  )
  .padding()
  ```
  
  **Note**: SwiftFormat may handle this with `wrapArguments` rules - verify before implementing
  

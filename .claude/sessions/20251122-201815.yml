                 • Good: let innerResult = condition2 ? value2 : value3
                         condition1 ? value1 : innerResult
              """
              violations.append(violation)
          }
      }
  
      /// Recursively check if an expression contains a ternary operator
      private static func containsTernary(_ expr: ExprSyntax) -> Bool {
          // Direct ternary check
          if expr.as(TernaryExprSyntax.self) != nil {
              return true
          }
  
          // Check through parentheses
          if let parenExpr = expr.as(TupleExprSyntax.self),
             parenExpr.elements.count == 1,
             let innerExpr = parenExpr.elements.first?.expression
          {
              return containsTernary(innerExpr)
          }
  
          return false
      }
  }

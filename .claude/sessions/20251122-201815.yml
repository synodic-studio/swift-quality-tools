      if isRed {
          Text("Hello").foregroundColor(.red)
      } else {
          Text("Hello")
      }
  }
  ```
  
  **Rationale**: The `.if` modifier pattern bypasses SwiftUI's view identity system and causes unnecessary re-renders.
  

      public static func checkExcessiveNesting(_ sourceFile: SourceFileSyntax, violations: inout [String]) {
          let converter = SourceLocationConverter(fileName: "", tree: sourceFile)
          let visitor = NestingDepthVisitor(converter: converter)
          visitor.walk(sourceFile)
  
          for violation in visitor.violations {
              violations.append(violation)
          }
      }
  
      /// Check for nested ternary operators
      /// Nested ternaries hurt readability - extract inner ternary to a named variable instead
      public static func checkNoNestedTernary(_ node: TernaryExprSyntax, violations: inout [String]) {
          // Check if either branch contains another ternary expression
          let hasTernaryInThen = containsTernary(node.thenExpression)
          let hasTernaryInElse = containsTernary(node.elseExpression)
  
          if hasTernaryInThen || hasTernaryInElse {
              let violation = """
              ⚠️  [no_nested_ternary] Avoid nested ternary operators - extract inner ternary to a named variable
                 • Bad:  condition1 ? value1 : condition2 ? value2 : value3
                 • Good: let innerResult = condition2 ? value2 : value3
                         condition1 ? value1 : innerResult
              """
              violations.append(violation)
          }
      }
  
      /// Recursively check if an expression contains a ternary operator
      private static func containsTernary(_ expr: ExprSyntax) -> Bool {
          // Direct ternary check
          if expr.as(TernaryExprSyntax.self) != nil {
              return true
          }
  
          // Check through parentheses
          if let parenExpr = expr.as(TupleExprSyntax.self),
             parenExpr.elements.count == 1,
             let innerExpr = parenExpr.elements.first?.expression
          {
              return containsTernary(innerExpr)
          }
  
          return false
      }
  }


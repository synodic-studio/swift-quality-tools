new: |
  ## Usage
  
  ### swift-quality-tools (MANDATORY - Run All Tools)
  
  **The unified command that enforces ALL quality standards. This is NOT OPTIONAL.**
  
  ```bash
  # Run all quality checks on current directory
  ~/Developer/swift-quality-tools/Scripts/swift-quality-tools .
  
  # Run on specific directory
  ~/Developer/swift-quality-tools/Scripts/swift-quality-tools Sources/
  
  # Add to PATH for convenience
  export PATH="$HOME/Developer/swift-quality-tools/Scripts:$PATH"
  swift-quality-tools .
  ```
  
  This command runs all three quality tools in sequence:
  1. **swiftformat-smart** - Code formatting
  2. **swiftlint-smart** - Standard linting rules
  3. **swiftlintcustom-smart** - Custom SwiftSyntax rules
  
  **Exit behavior:**
  - ✅ Exit code 0 if all tools pass
  - ❌ Exit code 1 on first failure (stops execution)
  - All violations MUST be fixed - no exceptions without explicit approval
  
  **Exemptions:**
  SwiftLint/SwiftFormat ignore directives are available but require explicit approval. These are an option of last resort only.
  
  ---
  
  ### Individual Tool Usage
  
  ### swiftformat-smart


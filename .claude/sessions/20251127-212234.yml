      private static func hasMultipleSiblings(_ node: IfExprSyntax) -> Bool {
          // Walk up to find the containing CodeBlockItemListSyntax
          var current: Syntax? = Syntax(node)
  
          while let parent = current?.parent {
              // Found the code block item list (e.g., inside a closure or function body)
              if let codeBlockItemList = parent.as(CodeBlockItemListSyntax.self) {
                  // Count siblings - if more than 1 item, we have siblings
                  if codeBlockItemList.count > 1 {
                      return true
                  }
              }
  
              // Check if we're inside a switch case - if the switch has multiple cases,
              // treat them as siblings (the if is one branch of a state machine)
              if let switchCase = parent.as(SwitchCaseSyntax.self) {
                  // Walk up to find the switch expression
                  if let switchExpr = findParentSwitch(switchCase) {
                      // Multiple cases = effectively has siblings
                      if switchExpr.cases.count > 1 {
                          return true
                      }
                  }
              }
  
              current = parent
          }
  
          return false
      }

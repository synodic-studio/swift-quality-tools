old: |
  ### Suppressing Custom Rules
  
  Custom rules support line-specific suppression using the `swiftlintcustom:` prefix:
  
  ```swift
  // swiftlintcustom:disable:next excessive_nesting
  var computed: String {
      // Deep nesting allowed here
  }
  
  // Or inline
  func deep() { // swiftlintcustom:disable:this excessive_nesting
      // ...
  }
  ```
  
  **Note:** Use `swiftlint:` for standard rules and `swiftlintcustom:` for custom rules. This keeps SwiftLint's `superfluous_disable_command` safety check working for standard rules.
  
  See `docs/swiftlint-directive-support.md` for full documentation.
new: |
  ### Suppressing Custom Rules
  
  Custom rules support suppression using the `swiftlintcustom:` prefix:
  
  **Line-specific suppression:**
  ```swift
  // swiftlintcustom:disable:next excessive_nesting
  var computed: String {
      // Deep nesting allowed on next line
  }
  
  // Inline suppression
  func deep() { // swiftlintcustom:disable:this excessive_nesting
      // ...
  }
  
  // Suppress previous line (useful when directive would interfere with other :next directives)
  Text("Content")
  // swiftlintcustom:disable:previous stack_minimum_children
  ```
  
  **Block-level suppression:**
  ```swift
  // swiftlintcustom:disable excessive_nesting no_if_without_else
  VStack {
      HStack {
          ForEach(items) { item in
              if condition {
                  // Deep nesting allowed in this block
                  ItemView(item: item)
              }
          }
      }
  }
  // swiftlintcustom:enable excessive_nesting no_if_without_else
  ```
  
  **File-level suppression:**
  ```swift
  // swiftlintcustom:disable preview_required
  // No #Preview needed in this file
  ```
  If `enable` is never called, the disable extends to end of file.
  
  **Note:** Use `swiftlint:` for standard rules and `swiftlintcustom:` for custom rules. This keeps SwiftLint's `superfluous_disable_command` safety check working for standard rules.
  
  ### Preview Exemption
  
  The `excessive_nesting` rule is automatically relaxed inside `#Preview` macros. Preview code often requires deeper nesting for setup and demo purposes, so violations inside previews are not reported.
  
  See `docs/swiftlint-directive-support.md` for full documentation.


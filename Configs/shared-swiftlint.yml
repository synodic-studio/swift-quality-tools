# Shared SwiftLint configuration for all Synodic projects
# This file provides common team standards across all Swift projects

# =============================================================================
# BASIC METRICS CONFIGURATION
# =============================================================================

# Reasonable line length limits
line_length:
  warning: 120
  error: 150
  ignores_urls: true
  ignores_function_declarations: true
  ignores_comments: true

# File and type size limits
file_length:
  warning: 120
  error: 200

type_body_length:
  warning: 100
  error: 150

# Function complexity limits
function_body_length:
  warning: 30
  error: 60

function_parameter_count:
  warning: 5
  error: 8

cyclomatic_complexity:
  warning: 10
  error: 15

# Nesting limits
nesting:
  type_level:
    warning: 3
    error: 4
  function_level:
    warning: 5
    error: 6

# =============================================================================
# RULE CONFIGURATIONS
# =============================================================================

# Trailing commas are handled by SwiftFormat - disabled here to avoid conflicts
# trailing_comma:
#   mandatory_comma: true

# =============================================================================
# BASIC OPT-IN RULES
# =============================================================================

opt_in_rules:
  # === SAFE PERFORMANCE IMPROVEMENTS ===
  - empty_count                        # Prefer isEmpty over count == 0
  - empty_string                       # Prefer isEmpty over string == ""
  - contains_over_filter_count         # Use contains instead of filter + count
  - contains_over_filter_is_empty      # Use contains instead of filter + isEmpty
  - first_where                        # Prefer first(where:) over filter + first
  - last_where                         # Prefer last(where:) over filter + last
  
  # === BASIC CODE QUALITY ===
  - closure_spacing                    # Consistent spacing in closures
  - redundant_nil_coalescing          # Remove redundant nil coalescing
  - redundant_type_annotation         # Remove redundant type annotations
  - toggle_bool                       # Use toggle() instead of = !
  - shorthand_operator               # Use shorthand operators (+=, -=, etc.)
  - no_magic_numbers                 # Discourage magic numbers in code

  # === BASIC SAFETY ===
  - unhandled_throwing_task           # Handle throwing tasks
  
  # === FILE ORGANIZATION ===
  - one_declaration_per_file          # Only one declaration per file

# =============================================================================
# ANALYZER RULES (require 'swiftlint analyze')
# =============================================================================

analyzer_rules:
  - unused_import                      # Remove unused imports

# =============================================================================
# DISABLED RULES
# =============================================================================

disabled_rules:
  - todo                              # Allow TODO comments during development
  - opening_brace                     # Intereferes with preference for multiline `if`
  - trailing_comma                    # SwiftFormat handles trailing commas
  - sorted_imports                    # SwiftFormat handles import sorting with @testable grouping

